steps:
  - id: Build container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: Push container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: Deploy Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --timeout=3600
      - --concurrency=200
      - --min-instances=1
      - --max-instances=1
      - --memory=1Gi
      - --cpu=1
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-env-vars=APP_URL=${_APP_URL},PGHOST=/cloudsql/${_CLOUD_SQL_INSTANCE},PGDATABASE=${_DATABASE},PGUSER=${_DATABASE_USER},PGPOOL_MAX=10
      - --set-secrets=GITHUB_CLIENT_ID=demystify-github-client-id:latest,GITHUB_CLIENT_SECRET=demystify-github-client-secret:latest,GITHUB_APP_SLUG=demystify-github-app-slug:latest,SESSION_SECRET=demystify-session-secret:latest,PGPASSWORD=demystify-database-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

substitutions:
  _REGION: us-west1
  _REPOSITORY: demystify
  _SERVICE: demystify
  _CLOUD_SQL_INSTANCE: SET_ME
  _DATABASE: demystify
  _DATABASE_USER: demystify
  _APP_URL: https://SET_ME

options:
  logging: CLOUD_LOGGING_ONLY