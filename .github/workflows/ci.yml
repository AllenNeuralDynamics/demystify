name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: demystify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d demystify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Test authenticated PostgreSQL collaboration
        run: npm run test:collaboration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/demystify_test

      - name: Test 5-editor 95-viewer collaboration load
        run: npm run test:collaboration:load
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/demystify_test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check production bundle budget
        run: npm run test:bundle

      - name: Audit production dependencies
        run: npm audit --omit=dev

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run local browser matrix
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14